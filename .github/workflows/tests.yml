name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - name: Ingest tests
        run: python3 tests/test_ingest.py
      - name: End-to-end run on a fresh dataset (rule baseline, no API key)
        run: |
          python3 data/generate_data.py --seed 7 > /dev/null
          python3 src/report.py --html --out /tmp/report.json
